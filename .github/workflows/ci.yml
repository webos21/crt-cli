name: CI

# Pull-request and main CI. A published CRT-CLI Preview (pinned by SHA-256 in .github/ci/pins.json) acquires the
# pinned public Dev SDK, builds the checked-out sources (stage 1), the deterministic native suites run on that
# stage-1 executable, and stage 1 rebuilds a clean export (stage 2). Bootstrap test results never count for the
# sources under test. See docs/guides/development.md#continuous-integration.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native:
    name: native (${{ matrix.label || matrix.host }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    # Keep both old-LTS and new Linux loader coverage required after the producer's TLSDESC repair.
    # The two Linux/x86_64 legs consume the same SDK pin; their artifacts have distinct names.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: linux-x64
            runner: ubuntu-26.04
            experimental: false
          - host: linux-x64
            label: linux-x64-ubuntu2404
            runner: ubuntu-24.04
            experimental: false
          # The Linux/aarch64 SDK was exercised only on glibc 2.43 (Ubuntu 26.04), so only that runner is required.
          - host: linux-arm64
            runner: ubuntu-26.04-arm
            experimental: false
          - host: macos-arm64
            runner: macos-15
            experimental: false
          - host: win-x64
            runner: windows-2022
            experimental: false
    steps:
      - name: Check out the sources under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python for the CI driver
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install LLVM 21 (Linux)
        if: startsWith(matrix.host, 'linux-')
        shell: bash
        run: |
          set -euo pipefail
          # Ubuntu 26.04 has LLVM 21 in its archive; noble needs the explicit signed LLVM repository.
          if [ "${{ matrix.runner }}" = ubuntu-24.04 ]; then
            fingerprint=6084F3CF814B57C1CF12EFD515CF4D18AF4F7421
            export GNUPGHOME="$(mktemp -d)"
            curl --proto '=https' --tlsv1.2 -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key -o "$GNUPGHOME/llvm.asc"
            gpg --batch --quiet --import "$GNUPGHOME/llvm.asc"
            sudo install -d -m 0755 /etc/apt/keyrings
            gpg --batch --export "$fingerprint" | sudo tee /etc/apt/keyrings/apt.llvm.org.gpg > /dev/null
            test -s /etc/apt/keyrings/apt.llvm.org.gpg
            gpg --batch --show-keys --with-colons /etc/apt/keyrings/apt.llvm.org.gpg | awk -F: '$1 == "fpr" { print $10 }' | grep -qx "$fingerprint"
            echo "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | sudo tee /etc/apt/sources.list.d/llvm21.list
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-21 lld-21 llvm-21 binutils
          /usr/lib/llvm-21/bin/clang --version
          /usr/lib/llvm-21/bin/ld.lld --version
          /usr/lib/llvm-21/bin/llvm-ar --version
          ldd --version

      - name: Check CI report gates
        run: python -m unittest discover -s tools -p test_ci_bootstrap.py

      - name: Install LLVM 22.1.8 (Windows)
        if: matrix.host == 'win-x64'
        shell: pwsh
        run: |
          choco install llvm --version 22.1.8 --allow-downgrade -y --no-progress
          & 'C:\Program Files\LLVM\bin\clang.exe' --version

      - name: Bootstrap, build, test and audit
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.host }}" in
            linux-x64|linux-arm64) llvm_bin=/usr/lib/llvm-21/bin ;;
            win-x64)   llvm_bin='C:/Program Files/LLVM/bin' ;;
            *)         llvm_bin= ;;
          esac
          args=(--work "$RUNNER_TEMP/crt-cli-ci" --host "${{ matrix.host }}" --native-test-jobs 2)
          if [ -n "$llvm_bin" ]; then args+=(--llvm-bin "$llvm_bin"); fi
          python tools/ci_bootstrap.py "${args[@]}"

      - name: Upload the stage-2 executable, receipts and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crt-cli-${{ matrix.label || matrix.host }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/crt-cli-ci/artifact/
            ${{ runner.temp }}/crt-cli-ci/logs/
            ${{ runner.temp }}/crt-cli-ci/sdk-source.json
          if-no-files-found: warn
          retention-days: 14

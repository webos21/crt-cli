name: CI

# Pull-request and main CI. A published CRT-CLI Preview (pinned by SHA-256 in .github/ci/pins.json) acquires the
# pinned public Dev SDK, builds the checked-out sources (stage 1), the deterministic native suites run on that
# stage-1 executable, and stage 1 rebuilds a clean export (stage 2). Bootstrap test results never count for the
# sources under test. See docs/guides/development.md#continuous-integration.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native:
    name: native (${{ matrix.host }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    # Linux uses Ubuntu 26.04, matching the local rehearsal's loader; the Ubuntu 24.04 shared-runtime gap remains
    # recorded in docs/acceptance/ci_acceptance.md. Failures on any of the three hosts fail CI.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: linux-x64
            runner: ubuntu-26.04
            experimental: false
          - host: macos-arm64
            runner: macos-15
            experimental: false
          - host: win-x64
            runner: windows-2022
            experimental: false
    steps:
      - name: Check out the sources under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python for the CI driver
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install LLVM 21 (Linux)
        if: matrix.host == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          # Ubuntu 26.04 provides LLVM 21 directly; do not mix in the older noble apt.llvm.org packages.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-21 lld-21 llvm-21 binutils
          /usr/lib/llvm-21/bin/clang --version
          /usr/lib/llvm-21/bin/ld.lld --version
          /usr/lib/llvm-21/bin/llvm-ar --version
          ldd --version

      - name: Install LLVM 22.1.8 (Windows)
        if: matrix.host == 'win-x64'
        shell: pwsh
        run: |
          choco install llvm --version 22.1.8 --allow-downgrade -y --no-progress
          & 'C:\Program Files\LLVM\bin\clang.exe' --version

      - name: Bootstrap, build, test and audit
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.host }}" in
            linux-x64) llvm_bin=/usr/lib/llvm-21/bin ;;
            win-x64)   llvm_bin='C:/Program Files/LLVM/bin' ;;
            *)         llvm_bin= ;;
          esac
          args=(--work "$RUNNER_TEMP/crt-cli-ci" --host "${{ matrix.host }}")
          if [ -n "$llvm_bin" ]; then args+=(--llvm-bin "$llvm_bin"); fi
          python tools/ci_bootstrap.py "${args[@]}"

      - name: Upload the stage-2 executable, receipts and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crt-cli-${{ matrix.host }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/crt-cli-ci/artifact/
            ${{ runner.temp }}/crt-cli-ci/logs/
            ${{ runner.temp }}/crt-cli-ci/sdk-source.json
          if-no-files-found: warn
          retention-days: 14

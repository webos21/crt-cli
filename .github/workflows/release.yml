name: Release

# Manually started, protected packaging of a CLI Preview from a tested commit. CI success is not publication authority:
#   package  builds exactly the requested commit with the pinned published CLI and the pinned public SDK, assembles the
#            notices and packs a deterministic archive (no write permission);
#   verify   extracts that archive on a separate fresh runner and runs the packaged executable, including a real GitHub
#            SDK acquisition and the C and C++ workflows (no write permission);
#   publish  waits for approval on the `release` environment, re-checks the artifact digest, stages a draft, compares the
#            downloaded draft byte for byte and only then publishes a non-latest prerelease. It is the only job with
#            `contents: write` and never rebuilds.
# `dry_run: true` stops at the verified draft; delete that draft by hand. Release notes are supplied as a reviewed file.

on:
  workflow_dispatch:
    inputs:
      host:
        description: Host to release
        type: choice
        options: [linux-x64, linux-arm64, macos-arm64, win-x64, win-arm64]
        required: true
      commit:
        description: Full 40-character commit SHA on main to build (a branch or tag is refused)
        type: string
        required: true
      date:
        description: Preview date, for example 20261111
        type: string
        required: true
      serial:
        description: Serial within that date and host, starting at 1
        type: string
        required: true
        default: '1'
      notes_file:
        description: Path of the reviewed release notes in the repository at that commit
        type: string
        required: true
      dry_run:
        description: Stop at the verified draft instead of publishing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.host }}
  cancel-in-progress: false

jobs:
  package:
    name: package (${{ inputs.host }})
    runs-on: ${{ fromJSON('{"linux-x64":"ubuntu-26.04","linux-arm64":"ubuntu-26.04-arm","macos-arm64":"macos-15","win-x64":"windows-2022","win-arm64":"windows-11-arm"}')[inputs.host] }}
    timeout-minutes: 120
    steps:
      - name: Check out exactly the requested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require the commit to be on main and to have passed CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ inputs.commit }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          git merge-base --is-ancestor "$COMMIT" origin/main || { echo "::error::$COMMIT is not on main"; exit 1; }
          state="$(gh api "repos/$REPO/commits/$COMMIT/check-runs" --jq '[.check_runs[]|select(.name=="CI gate")|.conclusion]|first // "none"')"
          echo "CI gate on $COMMIT: $state"
          [ "$state" = success ] || { echo "::error::CI gate has not succeeded for $COMMIT"; exit 1; }

      # An x64 Python on a Windows/arm64 runner reports AMD64 and would be refused as a non-native driver; ask for the native one.
      - name: Set up Python for the driver
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          architecture: ${{ inputs.host == 'win-arm64' && 'arm64' || '' }}

      - name: Install LLVM 21
        if: startsWith(inputs.host, 'linux-')
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-21 lld-21 llvm-21 binutils

      - name: Install LLVM 22.1.8 (Windows)
        if: inputs.host == 'win-x64'
        shell: pwsh
        run: |
          choco install llvm --version 22.1.8 --allow-downgrade -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & 'C:\Program Files\LLVM\bin\clang.exe' --version

      # The runner image carries LLVM 20 and Chocolatey's package is the x64 build, so the native ARM64 installer from the
      # LLVM release is downloaded, checked against its published SHA-256 and installed over the image's copy.
      - name: Install native ARM64 LLVM 22.1.8 (Windows/arm64)
        if: inputs.host == 'win-arm64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/LLVM-22.1.8-woa64.exe'
          $expected = '76f44ef1ba6eeb5a65904e9500f042f588fade49952778ce48f0374daa934396'
          $installer = Join-Path $env:RUNNER_TEMP 'LLVM-22.1.8-woa64.exe'
          Invoke-WebRequest -Uri $url -OutFile $installer
          $actual = (Get-FileHash -Algorithm SHA256 -Path $installer).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "LLVM installer digest mismatch: $actual" }
          $process = Start-Process -FilePath $installer -ArgumentList '/S', '/D=C:\Program Files\LLVM' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "LLVM installer exit code $($process.ExitCode)" }
          $version = & 'C:\Program Files\LLVM\bin\clang.exe' --version | Out-String
          Write-Host $version
          if ($version -notmatch 'clang version 22\.1\.8' -or $version -notmatch 'Target: aarch64-pc-windows-msvc') { throw 'not the native ARM64 LLVM 22.1.8' }

      - name: Check the driver's rules
        run: python -m unittest discover -s tools -p test_ci_release.py

      - name: Build, assemble and pack
        shell: bash
        env:
          HOST: ${{ inputs.host }}
          COMMIT: ${{ inputs.commit }}
          DATE: ${{ inputs.date }}
          SERIAL: ${{ inputs.serial }}
        run: |
          set -euo pipefail
          args=(--host "$HOST" --commit "$COMMIT" --date "$DATE" --serial "$SERIAL" --work "$RUNNER_TEMP/release-work")
          if [[ "$HOST" == linux-* ]]; then args+=(--llvm-bin /usr/lib/llvm-21/bin); fi
          if [[ "$HOST" == win-* ]]; then args+=(--llvm-bin 'C:/Program Files/LLVM/bin'); fi
          python tools/ci_release.py package "${args[@]}"

      - name: Upload the release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ inputs.host }}-${{ inputs.date }}-${{ inputs.serial }}
          path: ${{ runner.temp }}/release-work/release/
          if-no-files-found: error
          retention-days: 14

  verify:
    name: verify (${{ inputs.host }})
    needs: package
    runs-on: ${{ fromJSON('{"linux-x64":"ubuntu-26.04","linux-arm64":"ubuntu-26.04-arm","macos-arm64":"macos-15","win-x64":"windows-2022","win-arm64":"windows-11-arm"}')[inputs.host] }}
    timeout-minutes: 60
    steps:
      - name: Check out the driver at the requested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false

      - name: Set up Python for the driver
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          architecture: ${{ inputs.host == 'win-arm64' && 'arm64' || '' }}

      - name: Install LLVM 21
        if: startsWith(inputs.host, 'linux-')
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-21 lld-21 llvm-21 binutils

      - name: Install LLVM 22.1.8 (Windows)
        if: inputs.host == 'win-x64'
        shell: pwsh
        run: |
          choco install llvm --version 22.1.8 --allow-downgrade -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & 'C:\Program Files\LLVM\bin\clang.exe' --version

      # The runner image carries LLVM 20 and Chocolatey's package is the x64 build, so the native ARM64 installer from the
      # LLVM release is downloaded, checked against its published SHA-256 and installed over the image's copy.
      - name: Install native ARM64 LLVM 22.1.8 (Windows/arm64)
        if: inputs.host == 'win-arm64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/LLVM-22.1.8-woa64.exe'
          $expected = '76f44ef1ba6eeb5a65904e9500f042f588fade49952778ce48f0374daa934396'
          $installer = Join-Path $env:RUNNER_TEMP 'LLVM-22.1.8-woa64.exe'
          Invoke-WebRequest -Uri $url -OutFile $installer
          $actual = (Get-FileHash -Algorithm SHA256 -Path $installer).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "LLVM installer digest mismatch: $actual" }
          $process = Start-Process -FilePath $installer -ArgumentList '/S', '/D=C:\Program Files\LLVM' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "LLVM installer exit code $($process.ExitCode)" }
          $version = & 'C:\Program Files\LLVM\bin\clang.exe' --version | Out-String
          Write-Host $version
          if ($version -notmatch 'clang version 22\.1\.8' -or $version -notmatch 'Target: aarch64-pc-windows-msvc') { throw 'not the native ARM64 LLVM 22.1.8' }

      - name: Download the release files from the package job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ inputs.host }}-${{ inputs.date }}-${{ inputs.serial }}
          path: ${{ runner.temp }}/release-files

      - name: Extract and run the packaged executable
        shell: bash
        env:
          HOST: ${{ inputs.host }}
          DATE: ${{ inputs.date }}
          SERIAL: ${{ inputs.serial }}
        run: |
          set -euo pipefail
          args=(--host "$HOST" --date "$DATE" --serial "$SERIAL" --release-dir "$RUNNER_TEMP/release-files"
                --work "$RUNNER_TEMP/verify-work")
          if [[ "$HOST" == linux-* ]]; then args+=(--llvm-bin /usr/lib/llvm-21/bin); fi
          if [[ "$HOST" == win-* ]]; then args+=(--llvm-bin 'C:/Program Files/LLVM/bin'); fi
          python tools/ci_release.py verify "${args[@]}"

      - name: Upload the package verification result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-verify-${{ inputs.host }}-${{ inputs.date }}-${{ inputs.serial }}
          path: ${{ runner.temp }}/verify-work/verify.json
          if-no-files-found: error
          retention-days: 14

  publish:
    name: publish (${{ inputs.host }})
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Required reviewers are configured on this environment; the job does not start until a reviewer approves.
    environment: release
    permissions:
      contents: write
    steps:
      - name: Check out the driver and the reviewed release notes at the requested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false

      - name: Set up Python for the driver
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Download the verified release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ inputs.host }}-${{ inputs.date }}-${{ inputs.serial }}
          path: ${{ runner.temp }}/release-files

      - name: Stage, compare and publish
        env:
          GH_TOKEN: ${{ github.token }}
          HOST: ${{ inputs.host }}
          COMMIT: ${{ inputs.commit }}
          DATE: ${{ inputs.date }}
          SERIAL: ${{ inputs.serial }}
          NOTES: ${{ inputs.notes_file }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          args=(--host "$HOST" --commit "$COMMIT" --date "$DATE" --serial "$SERIAL" --repo "$REPO"
                --release-dir "$RUNNER_TEMP/release-files" --notes-file "$NOTES" --work "$RUNNER_TEMP/draft-check")
          if [ "$DRY_RUN" = true ]; then args+=(--draft-only); fi
          python tools/ci_release.py publish "${args[@]}"
